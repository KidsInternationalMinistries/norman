const D={"id": "ccc", "title": "Character, Calling & Conviction", "talk": {"timerMinutes": "45", "length": "About 45 min"}, "sections": [{"minutes": "5"}, {"minutes": "7"}, {"minutes": "10"}, {"minutes": "10"}, {"minutes": "8"}, {"minutes": "5"}], "relay": "https://ntfy.sh", "topic": "kim-talk-ccc-52631d90c22f43e7", "titleImg": "slides/title.jpg", "steps": [{"id": "cover", "label": "", "cue": "Opening slide", "sec": "", "img": "slides/cover.jpg", "detail": [], "verses": []}, {"id": "p1a", "label": "1.a", "cue": "Joke", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["Theme was going to be \"Nothing\"", "Got ready: a whole talk on nothing", "Three points, all nothing", "Theme changed, but I hate wasting good prep", "Bringing a little nothing anyway"], "verses": []}, {"id": "p1b", "label": "1.b", "cue": "The turn - Nothing", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["Funny thing: it actually fits", "\"Strong tie to the concept of nothing\"", "First of four speakers: the overview", "Others go deep on each word"], "verses": []}, {"id": "p1c", "label": "1.c", "cue": "Vine, branches, fruit", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["John 15:5: apart from me, nothing", "Branch doesn't strain to make fruit", "Stays connected; the vine produces", "Cut off = nothing", "Not \"less.\" Nothing."], "verses": [{"ref": "John 15:5", "text": "I am the vine; you are the branches. If you remain in me and I in you, you will bear much fruit; apart from me you can do nothing.", "version": "NIV"}]}, {"id": "p1d", "label": "1.d", "cue": "They are fruit", "sec": "1. Nothing", "img": "slides/p1d.jpg", "slideText": "Character, calling, conviction are fruit. Apart from Him, we cannot produce them.", "detail": ["🔑 \"Character, calling, conviction are fruit. Apart from Him, we cannot produce them.\"", "We try to manufacture fruit", "Character → try harder", "Calling → another conference", "Conviction → grit our teeth", "Fruit comes from the vine"], "verses": [{"ref": "Galatians 5:22–23", "text": "But the fruit of the Spirit is love, joy, peace, forbearance, kindness, goodness, faithfulness, gentleness and self-control. Against such things there is no law.", "version": "NIV"}]}, {"id": "p1e", "label": "1.e", "cue": "Disciples?", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["How did the disciples get theirs?", "Three years with Jesus", "Every sermon, every miracle", "Best discipleship program in history", "So did they have it?"], "verses": []}, {"id": "p1f", "label": "1.f", "cue": "Lack before Jesus died", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["Not before the resurrection", "Peter: denied Him three times", "The rest: lost hope, scattered", "Judas: betrayed Him", "Behind locked doors, afraid", "\"Where was their conviction? Their character? Did they feel called?\""], "verses": [{"ref": "Mark 14:50", "text": "Then everyone deserted him and fled.", "version": "NIV"}, {"ref": "Luke 22:61–62", "text": "The Lord turned and looked straight at Peter. Then Peter remembered the word the Lord had spoken to him: \"Before the rooster crows today, you will disown me three times.\" And he went outside and wept bitterly.", "version": "NIV"}, {"ref": "John 20:19", "text": "On the evening of that first day of the week, when the disciples were together, with the doors locked for fear of the Jewish leaders, Jesus came and stood among them and said, \"Peace be with you!\"", "version": "NIV"}]}, {"id": "p1g", "label": "1.g", "cue": "The last thing He said", "sec": "1. Nothing", "img": null, "slideText": "", "detail": ["Jesus rose; 40 days with them", "Last thing He said is interesting...", "The key to everything this week", "→ into Acts 1"], "verses": [{"ref": "Acts 1:3", "text": "After his suffering, he presented himself to them and gave many convincing proofs that he was alive. He appeared to them over a period of forty days and spoke about the kingdom of God.", "version": "NIV"}]}, {"id": "p2a", "label": "2.a", "cue": "Acts 1:6–8", "sec": "2. The power they expected", "img": null, "slideText": "", "detail": ["Read Acts 1:6–8", "Still asking about the kingdom", "\"When do we get back on top?\"", "Jesus doesn't answer it", "Asked for a kingdom; He gave power", "Power for: \"you will be my witnesses\"", "Jerusalem → Judea → Samaria → ends of the earth", "Power sends you where you didn't want to go"], "verses": [{"ref": "Acts 1:6–8", "text": "Then they gathered around him and asked him, \"Lord, are you at this time going to restore the kingdom to Israel?\" He said to them: \"It is not for you to know the times or dates the Father has set by his own authority. But you will receive power when the Holy Spirit comes on you; and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.\"", "version": "NIV"}]}, {"id": "p2b", "label": "2.b", "cue": "The Power piece", "sec": "2. The power they expected", "img": null, "slideText": "", "detail": ["Read the Power piece", "Picture the scene: \"Finally... nothing can stop us!\"", "\"Awesome!! We get power!!!\"", "Full of power, and full of trials", "\"You shall receive power\" will bring: opposition, difficulties, hard times, jail, conflict, thorns", "WILL reveal our weakness", "And then... in our weakness He is strong", "Don't expect it to look any different"], "verses": [{"ref": "Acts 1:6–8", "text": "Then they gathered around him and asked him, \"Lord, are you at this time going to restore the kingdom to Israel?\" He said to them: \"It is not for you to know the times or dates the Father has set by his own authority. But you will receive power when the Holy Spirit comes on you; and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.\"", "version": "NIV"}]}, {"id": "p2c", "label": "2.c", "cue": "Don't expect different", "sec": "2. The power they expected", "img": "slides/p2c.jpg", "slideText": "The disciples received power, and it brought prison, conflict and weakness. Don't expect it to look any different.", "detail": ["Acts 4: Peter and John in jail", "Acts 5: flogged, and they rejoiced", "Stephen stoned, James killed, church scattered", "Expected a throne, got a road", "Paul: called and told how much he'd suffer (Acts 9:16)", "Witness = martys (martyr)", "Our quiet expectation: \"if I'm called, it should go well\"", "Maybe that's what the power looks like", "🔑 \"The disciples received power, and it brought prison, conflict and weakness. Don't expect it to look any different.\""], "verses": [{"ref": "Acts 5:40–41", "text": "They called the apostles in and had them flogged. Then they ordered them not to speak in the name of Jesus, and let them go. The apostles left the Sanhedrin, rejoicing because they had been counted worthy of suffering disgrace for the Name.", "version": "NIV"}, {"ref": "Acts 9:15–16", "text": "But the Lord said to Ananias, \"Go! This man is my chosen instrument to proclaim my name to the Gentiles and their kings and to the people of Israel. I will show him how much he must suffer for my name.\"", "version": "NIV"}]}, {"id": "p2d", "label": "2.d", "cue": "Refrain", "sec": "2. The power they expected", "img": "slides/p2d.jpg", "slideText": "Character, calling, conviction. They didn't make them. His power produced them.", "detail": ["Same Peter: servant girl → Sanhedrin", "\"Unschooled, ordinary men... had been with Jesus\"", "Not a seminar, not trying harder", "🔁 Character, calling, conviction. They didn't make them. His power produced them."], "verses": [{"ref": "Acts 4:13", "text": "When they saw the courage of Peter and John and realized that they were unschooled, ordinary men, they were astonished and they took note that these men had been with Jesus.", "version": "NIV"}]}, {"id": "p3a", "label": "3.a", "cue": "Makes us into", "sec": "3. What the power makes us into", "img": "slides/p3a.jpg", "slideText": "His power isn't about how we change ourselves. It's about what He makes us into.", "detail": ["We argue about what the power looks like", "Miracles vs. \"God doesn't work that way now\"", "Not arguing today", "Wrong question: what it does", "Jesus: what it makes them into (\"you will BE\")", "Potter: marred pot, formed into another", "🔑 \"His power isn't about how we change ourselves. It's about what He makes us into.\""], "verses": [{"ref": "Jeremiah 18:4", "text": "But the pot he was shaping from the clay was marred in his hands; so the potter formed it into another pot, shaping it as seemed best to him.", "version": "NIV"}]}, {"id": "p3b", "label": "3.b", "cue": "Dynamis", "sec": "3. What the power makes us into", "img": null, "slideText": "", "detail": ["Acts 1:8 power = dynamis", "Same word: 2 Cor 12:9", "We love \"dynamite\"", "Paul begged 3x for the thorn to go", "God said no: power made perfect in weakness", "\"When I am weak, then I am strong\""], "verses": [{"ref": "2 Corinthians 12:9–10", "text": "But he said to me, \"My grace is sufficient for you, for my power is made perfect in weakness.\" Therefore I will boast all the more gladly about my weaknesses, so that Christ's power may rest on me. That is why, for Christ's sake, I delight in weaknesses, in insults, in hardships, in persecutions, in difficulties. For when I am weak, then I am strong.", "version": "NIV"}]}, {"id": "p3c", "label": "3.c", "cue": "Peter, broken", "sec": "3. What the power makes us into", "img": null, "slideText": "", "detail": ["Peter the strong one: first to speak, out of the boat, the sword", "The ear: strength without character", "\"Even if all fall away, I never will\"", "Real conviction, but his own", "Failed by a fire, a servant girl", "Me as a dad: my conviction in them washed away", "Conviction must be planted inside", "The look, wept bitterly", "Second fire: breakfast on the beach", "Three denials, three questions: \"Feed my sheep\"", "Had to break his self-sufficiency"], "verses": [{"ref": "Mark 14:29–31", "text": "Peter declared, \"Even if all fall away, I will not.\" \"Truly I tell you,\" Jesus answered, \"today, yes, tonight, before the rooster crows twice you yourself will disown me three times.\" But Peter insisted emphatically, \"Even if I have to die with you, I will never disown you.\" And all the others said the same.", "version": "NIV"}, {"ref": "John 21:15", "text": "When they had finished eating, Jesus said to Simon Peter, \"Simon son of John, do you love me more than these?\" \"Yes, Lord,\" he said, \"you know that I love you.\" Jesus said, \"Feed my lambs.\"", "version": "NIV"}]}, {"id": "p3d", "label": "3.d", "cue": "Strong vs. weak", "sec": "3. What the power makes us into", "img": "slides/p3d.jpg", "slideText": "We spend our whole lives striving to be strong, when God is calling us to be weak.", "detail": ["Hard part for leaders", "We got here by being strong", "Have the answer, fix the problem", "\"Nobody sends a weak missionary\"", "Me: 30 years in business, the one they called when things broke", "Watchman Nee: \"Effort is not the key to maturity; death is.\"", "🔑 \"We spend our whole lives striving to be strong, when God is calling us to be weak.\""], "verses": []}, {"id": "p3e", "label": "3.e", "cue": "Dad", "sec": "3. What the power makes us into", "img": null, "slideText": "", "detail": ["Dad, Gene: ~30 yrs Navigators in PH", "Effort focused: \"It's you, it's you\"", "Left the field broken", "Construction supervisor for my uncle", "Changed with age: never about his effort", "2009: hospital at St. Luke's, saw his old disciples still serving", "\"We sow, we water... God makes it grow\"", "His \"faulty ministry model\" → \"He is enough!\"", "Discipled two young men when I was three", "Today: our school director and our pastor, ~20 yrs", "Thought it came to nothing. God wasn't done."], "verses": [{"ref": "1 Corinthians 3:6–7", "text": "I planted the seed, Apollos watered it, but God has been making it grow. So neither the one who plants nor the one who waters is anything, but only God, who makes things grow.", "version": "NIV"}]}, {"id": "p3f", "label": "3.f", "cue": "Are you broken?", "sec": "3. What the power makes us into", "img": "slides/p3f.jpg", "slideText": "Are you broken?", "detail": ["Slide up, silence", "Maybe you came here broken", "Church, marriage, money, your own heart", "Feels like your work came to nothing", "Not the end, maybe the beginning", "\"In the ministry of love, only the wounded can serve.\"", "🔑 \"God cannot use someone who is not broken. If you are, you're exactly where He wants you to be.\""], "verses": []}, {"id": "p3g", "label": "3.g", "cue": "Refrain", "sec": "3. What the power makes us into", "img": "slides/p3g.jpg", "slideText": "Character, calling, conviction. We don't make them. His power makes them in our weakness.", "detail": ["Kintsugi: broken bowl repaired with gold", "Worth more than before it broke", "The cracks are where the gold is", "Treasure in jars of clay", "🔁 Character, calling, conviction. We don't make them. His power makes them in our weakness."], "verses": [{"ref": "2 Corinthians 4:7", "text": "But we have this treasure in jars of clay to show that this all-surpassing power is from God and not from us.", "version": "NIV"}]}, {"id": "p4a", "label": "4.a", "cue": "My own strength", "sec": "4. Seen in a life", "img": null, "slideText": "", "detail": ["2017: came to KIDS, ministry hurting", "Damaged by past leadership", "Money a struggle every month", "Prayer: \"Leadership, leadership, leadership\"", "Left business: lives impacted, not revenue", "Came in like a CTO: plans, budgets, systems", "My calling, delayed: Dad objected, went into business", "Years of preparation; calling = who He makes you", "\"Christ in me,\" but lived like it was up to me", "2019: healthier, still no leaders, tired"], "verses": [{"ref": "Proverbs 19:21", "text": "Many are the plans in a person's heart, but it is the LORD's purpose that prevails.", "version": "NIV"}]}, {"id": "p4b", "label": "4.b", "cue": "Everything stopped", "sec": "4. Seen in a life", "img": null, "slideText": "", "detail": ["2020: everything stopped", "Shut in, two weeks of nothing", "No money coming in, no plan", "Couldn't fundraise or plan my way out", "For the first time in a long time: nothing"], "verses": []}, {"id": "p4c", "label": "4.c", "cue": "Feeding", "sec": "4. Seen in a life", "img": "slides/p4c.jpg", "slideText": "3,000 to 250,000 meals a week", "detail": ["Hungry families at our gate", "Cooking at the market", "Local government asked for food", "\"Can we also feed the pastors?\"", "3,000 → 250,000 meals a week", "Pastora Grace: more afraid of hunger than COVID", "Didn't plan it; couldn't afford it", "Birthed youth + family ministry, clinic ×10, 1,000+ pastors"], "verses": []}, {"id": "p4d", "label": "4.d", "cue": "The $50,000 text", "sec": "4. Seen in a life", "img": null, "slideText": "", "detail": ["At the table: time to stop the feeding", "Pastor Art: \"We can't. There's people who are hungry, Norman.\"", "\"There's no money,\" walked away", "Phone: former boss, not a Christian", "His board: $50,000", "\"Never mind. The money came in.\"", "Not my strength; God was already there"], "verses": []}, {"id": "p4e", "label": "4.e", "cue": "4am to 11pm", "sec": "4. Seen in a life", "img": "slides/p4e.jpg", "slideText": "When I strive in my strength, I burn out. When I strive in His, I'm refreshed.", "detail": ["The leaders came, the ones I prayed for", "Pastor Art: partner in the feedings", "His son: Youth Lab, first youth ministry", "Volunteers quarantined together → missionaries", "0 → 26 Filipino missionaries", "Hardest and most beautiful season", "Up at 4am, working till 10 or 11pm, loved it", "Windsurfing: I don't make the wind", "Col 1:29: all His energy", "🔑 \"When I strive in my strength, I burn out. When I strive in His, I'm refreshed.\""], "verses": [{"ref": "Colossians 1:29", "text": "To this end I strenuously contend with all the energy Christ so powerfully works in me.", "version": "NIV"}]}, {"id": "p4f", "label": "4.f", "cue": "Faith", "sec": "4. Seen in a life", "img": "slides/p4f.jpg", "slideText": "If I can do it myself, it isn't faith.", "detail": ["Building a high school, poor community", "Still not finished: more floors, an auditorium", "\"How will you finish it?\" I don't know", "If I can see it on a spreadsheet, I need a calculator, not faith", "\"If God's love is extravagant, why not the school?\"", "🔑 \"If I can do it myself, it isn't faith.\""], "verses": [{"ref": "Hebrews 11:1", "text": "Now faith is confidence in what we hope for and assurance about what we do not see.", "version": "NIV"}]}, {"id": "p4g", "label": "4.g", "cue": "Loss (optional)", "sec": "4. Seen in a life", "img": null, "slideText": "", "detail": ["(Optional, judgment call on the day)", "A very personal season", "My conviction about my life gave way", "Not going into it", "God used the loss to change me"], "verses": []}, {"id": "p4h", "label": "4.h", "cue": "Refrain", "sec": "4. Seen in a life", "img": null, "slideText": "", "detail": ["I'm not the strong one; I never was", "Same pattern as Peter, as my dad", "🔁 Character, calling, conviction. We don't make them. His power makes them in our weakness."], "verses": [{"ref": "Romans 5:3–4", "text": "Not only so, but we also glory in our sufferings, because we know that suffering produces perseverance; perseverance, character; and character, hope.", "version": "NIV"}]}, {"id": "p5a", "label": "5.a", "cue": "Not tidy", "sec": "5. Ministry is messy", "img": "slides/p5a.jpg", "slideText": "Ministry is messy, and there's beauty in the mess.", "detail": ["CCC sound tidy: in a box, checked off", "The opposite is true", "Painter's palette: a mess", "Every painting started on a messy palette", "If life were straight lines, we wouldn't need God", "God puts us where the mess shows up", "🔑 \"Ministry is messy, and there's beauty in the mess.\""], "verses": []}, {"id": "p5b", "label": "5.b", "cue": "Not in control", "sec": "5. Ministry is messy", "img": null, "slideText": "", "detail": ["Mess teaches humility", "I'm not in control; I can't fix it", "Expect clean → disappointed → angry", "Dad: the small interruptions are harder than the big trials", "Even now, strained relationships; God at work in the middle", "Expect the mess, and God in it"], "verses": []}, {"id": "p5c", "label": "5.c", "cue": "Join Him", "sec": "5. Ministry is messy", "img": "slides/p5c.jpg", "slideText": "I find God's voice in the doing, not just the waiting.", "detail": ["Blackaby: find where God is working, join Him", "Jesus: \"My Father is always at work\"", "Not my best place: sitting still for hours", "Try something, see if God blesses it", "Adjust, or move on", "Hungry family, a pastor, a volunteer who won't go home", "Whole life becomes my prayer life", "\"Where God goes, go there. Don't expect God to follow us.\"", "🔑 \"I find God's voice in the doing, not just the waiting.\""], "verses": [{"ref": "John 5:17, 19", "text": "In his defense Jesus said to them, \"My Father is always at his work to this very day, and I too am working.\" ... Jesus gave them this answer: \"Very truly I tell you, the Son can do nothing by himself; he can do only what he sees his Father doing, because whatever the Father does the Son also does.\"", "version": "NIV"}]}, {"id": "p5d", "label": "5.d", "cue": "Bring order", "sec": "5. Ministry is messy", "img": null, "slideText": "", "detail": ["Balance: don't go looking for mess", "Don't create it", "Bring God's order into it", "Christ didn't stand outside our mess", "\"The Word became flesh\"", "Born in a feeding trough, in a barn", "God's answer to the mess: a baby in a manger", "Tondo 2009: Grace, Lola Maming's mangoes", "\"Probably the only Jesus many had ever seen\""], "verses": [{"ref": "John 1:14", "text": "The Word became flesh and made his dwelling among us. We have seen his glory, the glory of the one and only Son, who came from the Father, full of grace and truth.", "version": "NIV"}]}, {"id": "p5e", "label": "5.e", "cue": "The whole journey", "sec": "5. Ministry is messy", "img": "slides/p5e.jpg", "slideText": "God doesn't see a point in time. He sees the whole journey.", "detail": ["In the middle of the mess, remember:", "Dad's circus story: knothole vs. up in the tree", "\"God sees at one glance every episode of our lives\"", "Don't judge your ministry, or anyone else, by one frame", "He who began a good work will finish it", "🔑 \"God doesn't see a point in time. He sees the whole journey.\""], "verses": [{"ref": "Philippians 1:6", "text": "being confident of this, that he who began a good work in you will carry it on to completion until the day of Christ Jesus.", "version": "NIV"}]}, {"id": "p5f", "label": "5.f", "cue": "Refrain", "sec": "5. Ministry is messy", "img": "slides/p5f.jpg", "slideText": "Character, calling, conviction. We don't make them. His power makes them in the mess.", "detail": ["Paul's best letters: from prison", "Philippians: joy, from a cell", "\"It is God who works in you\" (Phil 2:13)", "🔁 Character, calling, conviction. We don't make them. His power makes them in the mess."], "verses": [{"ref": "Philippians 2:13", "text": "for it is God who works in you to will and to act in order to fulfill his good purpose.", "version": "NIV"}]}, {"id": "p6a", "label": "6.a", "cue": "Don't expect different (callback)", "sec": "6. Bookend and hand-off", "img": null, "slideText": "", "detail": ["Callback: \"Don't expect it to look any different\"", "Don't expect the mess to be different either", "The power and the mess: the same thing"], "verses": []}, {"id": "p6b", "label": "6.b", "cue": "Where the power lives", "sec": "6. Bookend and hand-off", "img": "slides/p6b.jpg", "slideText": "The mess is where the power lives.", "detail": ["Started in a manger, ended at a cross", "Cross: biggest mess in history", "And the greatest display of His power", "Foolishness to some; to us, the power of God", "🔑 \"The mess is where the power lives.\""], "verses": [{"ref": "1 Corinthians 1:18, 25", "text": "For the message of the cross is foolishness to those who are perishing, but to us who are being saved it is the power of God. ... For the foolishness of God is wiser than human wisdom, and the weakness of God is stronger than human strength.", "version": "NIV"}]}, {"id": "p6c", "label": "6.c", "cue": "Walk the line", "sec": "6. Bookend and hand-off", "img": "slides/p6c.jpg", "slideText": "There's a thin line between faith and insanity. Walk the line.", "detail": ["High school: people thought I was crazy", "Sometimes I did too", "From outside, faith and insanity look the same", "Never near the line → never need faith", "🔑 \"There's a thin line between faith and insanity. Walk the line.\""], "verses": []}, {"id": "p6d", "label": "6.d", "cue": "Nothing after all", "sec": "6. Bookend and hand-off", "img": null, "slideText": "", "detail": ["Came to talk about nothing after all", "Remember the branch", "Apart from Him, nothing. In Him, fruit.", "Not bad news: it was never up to you"], "verses": [{"ref": "Ephesians 2:10", "text": "For we are God's handiwork, created in Christ Jesus to do good works, which God prepared in advance for us to do.", "version": "NIV"}]}, {"id": "p6e", "label": "6.e", "cue": "Closing and hand-off", "sec": "6. Bookend and hand-off", "img": "slides/p6e.jpg", "slideText": "Listen for what He's making you into.", "detail": ["Read the closing paragraph", "Kingdom → power → made them different", "Peter's conviction failed by a fire", "God formed, clarified, planted: His", "\"Don't listen for what you need to do for God\"", "\"Listen for what He's making you into\"", "Hand off to the next three speakers"], "verses": []}]};

  st.className=follow?(connected||bcSeen?"on":""):"local";
  st.lastChild.textContent=follow?(connected||bcSeen?"Following the presenter":"Waiting for the presenter"):"Stepping here, snaps back when the presenter moves"}
function fromPresenter(m){if(!m||!m.point)return;if(m.at&&m.at<=lastAt)return;lastAt=m.at||Date.now();const i=idx(m.point);if(i<0)return;pres=i;follow=true;show()}
function step(d){let cur=heldIdx(follow?pres:local);let k=slideSteps.indexOf(cur);
  if(k<0)k=d>0?-1:0;k=Math.max(0,Math.min(slideSteps.length-1,k+d));local=slideSteps[k];follow=false;show()}
document.getElementById("b").onclick=()=>step(-1);document.getElementById("n").onclick=()=>step(1);
const full=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.getElementById("f").onclick=full;
document.addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();step(1)}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();step(-1)}else if(e.key==="f"||e.key==="F")full()});
let hideT;const ui=document.getElementById("ui");function wake(){ui.classList.remove("hide");clearTimeout(hideT);hideT=setTimeout(()=>ui.classList.add("hide"),3000)}
document.addEventListener("mousemove",wake);document.addEventListener("touchstart",wake);wake();
if(bc)bc.onmessage=e=>{bcSeen=true;fromPresenter(e.data)};
async function catchUp(){try{const r=await fetch(RELAY+"/json?poll=1&since=12h",{cache:"no-store"});const t=await r.text();
  const L=t.trim().split("\n").filter(Boolean).map(x=>{try{return JSON.parse(x)}catch(e){return null}}).filter(x=>x&&x.event==="message");
  if(L.length){try{fromPresenter(JSON.parse(L[L.length-1].message))}catch(e){}}}catch(e){}}
function listen(){try{const es=new EventSource(RELAY+"/sse");
  es.onopen=()=>{connected=true;show();catchUp()};
  es.onerror=()=>{connected=false;show()};
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="message")fromPresenter(JSON.parse(m.message))}catch(_){}}}catch(e){}}
show();catchUp();listen();
</script></body></html>
